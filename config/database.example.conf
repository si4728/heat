# Copy to database.conf and enter the existing iris2 database credentials.
# Editing this file does not change MariaDB user passwords or grants.
[database]
host = 127.0.0.1
port = 3307
name = iris2
user = iris2_app
password = REPLACE_WITH_ACTUAL_PASSWORD
charset = utf8mb4

[schemas]
heat_exchanger_db3.db = iris2
llm_report_review.db = iris2_llm
ml_review_feedback.db = iris2_ml
pdf_ocr_review.db = iris2_pdf
