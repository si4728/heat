{% extends "base.html" %}{% block title %}작업지시 등록{% endblock %}{% block heading %}작업지시 등록{% endblock %}{% block content %}<article class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="full">열교환기<select name="heat_exchanger_id" required>{% for hx,e,u,p in exchangers %}<option value="{{ hx.heat_exchanger_id }}">{{ p.plant_code|plant_display }}/{{ u.unit_code }} · {{ e.equipment_code }}</option>{% endfor %}</select></label><label>작업번호<input name="work_order_code" placeholder="미입력 시 자동 생성"></label><label>유형<select name="work_type"><option value="MAINTENANCE">정비</option><option value="REPLACEMENT">열교환기 전체 Replacement</option><option value="PLUGGING">튜브 사용중지 (Plugging)</option></select></label><label class="full">제목<input name="title" required></label><label>시작 예정일<input type="date" name="planned_start"></label><label>종료 예정일<input type="date" name="planned_end"></label><label>우선도<select name="priority"><option>NORMAL</option><option>HIGH</option><option>URGENT</option></select></label><label class="full">설명<textarea name="description"></textarea></label><button class="button primary full">등록</button></form></article>{% endblock %}
