{% extends "base.html" %}
{% block title %}Wall Loss 색상 기준{% endblock %}
{% block heading %}Wall Loss 색상 기준{% endblock %}
{% block content %}
<article class="panel"><div class="panel-head"><h2>Wall Loss ? 10% bands</h2></div>
<div style="padding:20px"><p id="palette-description"></p>
<div id="palette-reference" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"></div></div></article>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='wall-loss-palette.js', v='20261029-bands-1') }}"></script>
<script>
document.getElementById('palette-description').textContent = '\uC815\uBC00\uBD84\uC11D / 2D / 3D Map: \uC6D0\uBCF8 \uBCF4\uACE0\uC11C \uBC29\uC2DD\uC758 \uACE0\uC815 \uD314\uB808\uD2B8. \uC18C\uC218\uB294 \uC815\uC218 \uBC18\uC62C\uB9BC \uD6C4 \uC0C9\uC0C1\uB9CC \uBD84\uB958\uD569\uB2C8\uB2E4. Plugging / \uC794\uC5EC\uC218\uBA85 \uACC4\uC0B0 \uAE30\uC900\uC740 \uBCC0\uACBD\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.';
IrisWallLossPalette.bands.forEach(band=>{
 const row=document.createElement('div'),icon=document.createElement('i');
 icon.style.cssText=`display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid #64748b;margin-right:8px;background:${band.color}`;
 row.append(icon,document.createTextNode(band.label));document.getElementById('palette-reference').append(row);
});
</script>
{% endblock %}
